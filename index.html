<!DOCTYPE html>
<html lang="en" class="light scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>The Culinary Editorial</title>
    <link rel="icon" href="/lovable-uploads/72105a14-071b-4a8c-a0c5-981aa2ca4064.png" type="image/png">
    <meta name="description" content="The Culinary Editorial - Premium Restaurant Discovery & Review Platform" />
    <meta name="author" content="The Culinary Editorial" />

    <!-- Google Fonts: Noto Serif (headlines/italic) + Manrope (body/labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Preconnect to Supabase Edge Functions for image proxy -->
    <link rel="preconnect" href="https://ocpmhsquwsdaauflbygf.functions.supabase.co" crossorigin>

    <meta property="og:title" content="The Culinary Editorial" />
    <meta property="og:description" content="Discover and review premium restaurants with curated editorial insights" />
    <meta property="og:type" content="website" />

    <script>
      // Default to light mode for editorial aesthetic
      (function() {
        const stored = localStorage.getItem('theme');
        const theme = stored || 'light';
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(theme);
      })();
    </script>
    <script>
      // Single Page Apps for GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
